name: Sync upstream and publish image

on:
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync production from upstream
        run: |
          git remote add upstream https://github.com/bookwyrm-social/bookwyrm.git
          git fetch upstream
          git checkout -B production upstream/production
          git push origin production --force

      - name: Merge production into ci
        run: |
          git checkout ci
          git merge production -m "sync upstream $(date -u +%Y-%m-%d)" || true
          git push origin ci

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/bookwyrm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
